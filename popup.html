<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Grab Design</title>
  </head>
  <body>
    <main class="panel">
      <div class="masthead">
        <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <span class="eyebrow">Design extractor</span>
      </div>

      <h1>Saisir ce qui<br /><em>vous inspire.</em></h1>
      <p class="intro">Transformez n’importe quel élément visible en un instantané HTML et CSS prêt à coller.</p>

      <button id="startCapture" class="capture-button" type="button">
        <span class="crosshair" aria-hidden="true"></span>
        <span>Choisir un élément</span>
        <kbd aria-hidden="true">↗</kbd>
      </button>

      <div class="steps" aria-label="Mode d’emploi">
        <div class="step"><b>01</b><span>Survolez la zone à capturer</span></div>
        <div class="step"><b>02</b><span>Cliquez pour copier le code</span></div>
        <div class="step"><b>Esc</b><span>Annule la sélection</span></div>
      </div>

      <p id="status" class="status" role="status" aria-live="polite">Prêt à inspecter la page.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
